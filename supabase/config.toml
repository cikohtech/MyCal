project_id = "my-cal"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# No inbox detour: creating an account signs you straight in. The hosted
# project needs the same — Authentication → Providers → Email → "Confirm
# email" off — or sign-up hands back no session.
enable_confirmations = false

# Local Google sign-in reads these from the shell; on the hosted project the
# same pair goes in Authentication → Providers → Google, and Google's own
# OAuth client needs https://<project>.supabase.co/auth/v1/callback as an
# authorized redirect URI.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false

# Both functions verify the caller's JWT themselves before touching anything.
[functions.analyze-food-photo]
verify_jwt = true

[functions.lookup-barcode]
verify_jwt = true
